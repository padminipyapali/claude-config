<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session Tracker</title>
<style>
  :root {
    --bg: #060608;
    --surface: #111114;
    --surface-2: #18181c;
    --surface-hover: #1e1e24;
    --border: #222228;
    --border-subtle: #1a1a1f;
    --text: #e8e8ed;
    --text-dim: #8888a0;
    --text-muted: #555566;
    --accent: #b4a0ff;
    --second-brain: #818cf8;
    --lexica: #22d3ee;
    --command-center: #fbbf24;
    --nanny-app: #34d399;
    --claude-test: #a78bfa;
    --note-color: #e0b0ff;
    --pr-color: #f0883e;
    --added: #3fb950;
    --removed: #f85149;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif;
    padding: 2rem 2.5rem;
    max-width: 1000px;
    margin: 0 auto;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }

  .header {
    text-align: center;
    margin-bottom: 2rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--border);
  }
  .header h1 {
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 0.4rem;
  }
  .header .date-range {
    font-size: 1.4rem;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  /* Stats */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.1rem 1rem;
    text-align: center;
  }
  .stat-value {
    font-size: 1.6rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.03em;
  }
  .stat-label {
    color: var(--text-muted);
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 0.15rem;
  }

  /* Sections */
  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1rem;
  }
  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
  }
  .section-title {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--text-muted);
    font-weight: 500;
  }
  .toggle-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 0.65rem;
    padding: 0.25rem 0.6rem;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 0.03em;
  }
  .toggle-btn:hover { border-color: var(--text-muted); color: var(--text); }

  /* Chart */
  .chart-container { position: relative; }
  .chart-row {
    display: flex;
    align-items: center;
    margin-bottom: 4px;
    height: 20px;
  }
  .chart-row.hidden { display: none; }
  .chart-label {
    width: 2.5rem;
    font-size: 0.65rem;
    color: var(--text-muted);
    text-align: right;
    margin-right: 0.6rem;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  .chart-bar-track {
    flex: 1;
    height: 16px;
    display: flex;
    border-radius: 3px;
    overflow: hidden;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .chart-bar-track:hover { opacity: 0.8; }
  .chart-bar-track.note-only {
    border: 1px dashed var(--note-color);
    opacity: 0.5;
    height: 14px;
    margin: 1px 0;
  }
  .chart-bar-segment { height: 100%; min-width: 2px; }
  .chart-meta {
    width: 6.5rem;
    display: flex;
    gap: 0.5rem;
    justify-content: flex-end;
    margin-left: 0.6rem;
    flex-shrink: 0;
  }
  .chart-meta span {
    font-size: 0.65rem;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  .chart-meta .commits-count { color: var(--text-dim); font-weight: 500; }

  .legend {
    display: flex;
    gap: 1rem;
    margin-top: 1rem;
    padding-top: 0.75rem;
    border-top: 1px solid var(--border-subtle);
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.65rem;
    color: var(--text-muted);
  }
  .legend-dot {
    width: 7px;
    height: 7px;
    border-radius: 2px;
  }

  /* Table */
  .table-wrap {
    overflow-x: auto;
    max-height: 70vh;
    overflow-y: auto;
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
  thead th {
    text-align: left;
    padding: 0.5rem 0.65rem;
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    font-weight: 500;
    white-space: nowrap;
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 1;
  }
  thead th.r { text-align: right; }
  tbody td {
    padding: 0.5rem 0.65rem;
    border-bottom: 1px solid var(--border-subtle);
    vertical-align: middle;
  }
  tbody td.r { text-align: right; font-variant-numeric: tabular-nums; }
  tbody td.mono { font-variant-numeric: tabular-nums; }
  tbody tr.session-row {
    cursor: pointer;
    transition: background 0.1s;
  }
  tbody tr.session-row:hover { background: var(--surface-hover); }
  .current-badge {
    display: inline-block;
    font-size: 0.55rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 3px;
    padding: 0 4px;
    margin-left: 6px;
    vertical-align: middle;
    opacity: 0.8;
  }
  .repo-pills { display: flex; gap: 3px; flex-wrap: wrap; }
  .repo-pill {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 0.6rem;
    font-weight: 500;
  }
  .note-pill {
    border: 1px dashed var(--note-color);
    color: var(--note-color);
    opacity: 0.7;
  }
  .pr-pill {
    border: 1px dashed var(--pr-color);
    color: var(--pr-color);
    opacity: 0.7;
  }
  .expand-ind {
    color: var(--text-muted);
    font-size: 0.6rem;
    transition: transform 0.15s;
    display: inline-block;
    width: 0.8rem;
  }
  .expanded .expand-ind { transform: rotate(90deg); }

  .detail-row { display: none; }
  .detail-row.open { display: table-row; }
  .detail-row td {
    padding: 0.6rem 0.65rem 0.8rem 2rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
  }
  .detail-section { margin-bottom: 0.6rem; }
  .detail-section:last-child { margin-bottom: 0; }
  .detail-section-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 0.3rem;
  }
  .detail-note {
    font-size: 0.72rem;
    color: var(--note-color);
    padding: 0.2rem 0 0.2rem 0.65rem;
    border-left: 2px solid var(--note-color);
    margin: 0.15rem 0;
    opacity: 0.85;
    font-style: italic;
  }
  .detail-pr {
    font-size: 0.72rem;
    color: var(--pr-color);
    padding: 0.2rem 0 0.2rem 0.65rem;
    border-left: 2px solid var(--pr-color);
    margin: 0.15rem 0;
    opacity: 0.85;
  }
  .detail-repo { margin-bottom: 0.5rem; }
  .detail-repo:last-child { margin-bottom: 0; }
  .detail-repo-header {
    font-size: 0.68rem;
    font-weight: 600;
    margin-bottom: 0.25rem;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .detail-repo-stats { font-weight: 400; color: var(--text-muted); font-size: 0.65rem; }
  .detail-msg {
    font-size: 0.68rem;
    color: var(--text-dim);
    padding: 0.12rem 0 0.12rem 0.65rem;
    border-left: 2px solid var(--border);
    margin: 0.12rem 0;
  }
  .c-added { color: var(--added); }
  .c-removed { color: var(--removed); }

  @media (max-width: 640px) {
    body { padding: 1rem; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .chart-meta { width: 4.5rem; }
  }
</style>
</head>

<div class="header">
  <h1>Session Tracker</h1>
  <div class="date-range" id="date-range"></div>
</div>
<div class="stats" id="stats"></div>

<div class="section">
  <div class="section-header">
    <div class="section-title">Activity per Session</div>
    <button class="toggle-btn" id="chart-toggle" onclick="toggleChart()">Show all</button>
  </div>
  <div class="chart-container" id="chart"></div>
  <div class="legend" id="legend"></div>
</div>

<div class="section">
  <div class="section-header">

  <div class="table-wrap">

        <th>Activity</th><th class="r">Commits</th><th class="r">Lines</th>
      </tr></thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
</div>

number":29,"date":"Feb 19","start":"12:28 PM","end":"12:28 PM","start_ts":1771532913,"end_ts":1771532929,"duration":1,"current":true,"notes":[],"ghEvents":[{"type":"comment","repo":"command-center","text":"PR #21: [vc]: #kocOY/DrjkMOvXwc4su5LmhOCSgRQt2GpPnOjh1p1VY=:eyJpc01vbm9yZXBvIjp0cnVlLCJ0"},{"type":"comment","repo":"command-center","text":"PR #21: <!-- This is an auto-generated comment: summarize by coderabbit.ai -->"}],"repos":[]}];
const TOTALS = {sessions:29,minutes:2460,commits:273,added:79327,removed:4266,notes:2,prEvents:429,time:"41h 0m",addedFmt:"79.3K",removedFmt:"4.2K"};
const DATE_RANGE = "Feb 12 – Feb 19, 2026";

const COLORS = {
  'second-brain': '#818cf8',
  'lexica': '#22d3ee',
  'command-center': '#fbbf24',
  'nanny-app': '#34d399',
  'claude-test': '#a78bfa'
};

const fmt = n => n >= 1000 ? (n/1000).toFixed(1) + 'K' : String(n);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// Reverse: newest first
const sessions = [...SESSIONS].reverse();

// Header
document.getElementById('date-range').textContent = DATE_RANGE;

// Stats
document.getElementById('stats').innerHTML = [
  { v: TOTALS.sessions, l: 'Sessions' },
  { v: TOTALS.time, l: 'Total Time' },
  { v: TOTALS.commits, l: 'Commits' },
  { v: `+${TOTALS.addedFmt} / -${TOTALS.removedFmt}`, l: 'Lines Changed' },
].map(c => `<div class="stat-card"><div class="stat-value">${c.v}</div><div class="stat-label">${c.l}</div></div>`).join('');

// Chart (newest first, show first 10 by default)
const CHART_LIMIT = 10;
let chartExpanded = false;
const maxCommits = Math.max(...sessions.map(s => s.repos.reduce((sum, r) => sum + r.commits, 0)), 1);
const allRepos = new Set();
sessions.forEach(s => s.repos.forEach(r => allRepos.add(r.name)));

function renderChart() {
  const chartEl = document.getElementById('chart');
  chartEl.innerHTML = sessions.map((s, i) => {
    const totalCommits = s.repos.reduce((sum, r) => sum + r.commits, 0);
    const isNoteOnly = totalCommits === 0;
    const pct = isNoteOnly ? 3 : (totalCommits / maxCommits) * 100;
    const hidden = !chartExpanded && i >= CHART_LIMIT ? 'hidden' : '';
    const currentMark = s.current ? ' *' : '';

    let barContent;
    if (isNoteOnly) {
      barContent = `<div class="chart-bar-track note-only" onclick="toggleRow(${s.number})"></div>`;
    } else {
      const segments = s.repos.map(r => {
        const segPct = (r.commits / totalCommits) * pct;
        return `<div class="chart-bar-segment" style="width:${segPct}%;background:${COLORS[r.name]||'#666'}"></div>`;
      }).join('');
      barContent = `<div class="chart-bar-track" onclick="toggleRow(${s.number})">${segments}</div>`;
    }

    const metaText = isNoteOnly
      ? `<span style="color:var(--note-color);opacity:0.6">notes</span><span>${s.duration}m</span>`
      : `<span class="commits-count">${totalCommits}</span><span>${s.duration}m</span>`;

    return `<div class="chart-row ${hidden}" data-chart-row>
      <div class="chart-label">#${s.number}${currentMark}</div>
      ${barContent}
      <div class="chart-meta">${metaText}</div>
    </div>`;
  }).join('');

  const btn = document.getElementById('chart-toggle');
  if (sessions.length <= CHART_LIMIT) {
    btn.style.display = 'none';
  } else {
    btn.textContent = chartExpanded ? `Show recent ${CHART_LIMIT}` : `Show all ${sessions.length}`;
  }
}

function toggleChart() {
  chartExpanded = !chartExpanded;
  renderChart();
}
renderChart();

// Legend
document.getElementById('legend').innerHTML = [...allRepos].map(name =>
  `<div class="legend-item"><div class="legend-dot" style="background:${COLORS[name]||'#666'}"></div>${name}</div>`
).join('') + (TOTALS.notes > 0 ? `<div class="legend-item"><div class="legend-dot" style="background:var(--note-color);opacity:0.6"></div>notes</div>` : '');

// Table (newest first)
const tbody = document.getElementById('table-body');
sessions.forEach(s => {
  const totalCommits = s.repos.reduce((sum, r) => sum + r.commits, 0);
  const totalAdded = s.repos.reduce((sum, r) => sum + r.added, 0);
  const totalRemoved = s.repos.reduce((sum, r) => sum + r.removed, 0);

  const pills = [];
  if (s.notes && s.notes.length > 0) pills.push(`<span class="repo-pill note-pill">notes</span>`);
  if (s.ghEvents && s.ghEvents.length > 0) pills.push(`<span class="repo-pill pr-pill">PRs</span>`);
  s.repos.forEach(r => pills.push(
    `<span class="repo-pill" style="background:${COLORS[r.name]||'#666'}18;color:${COLORS[r.name]||'#666'}">${r.name}</span>`
  ));

  const currentBadge = s.current ? '<span class="current-badge">now</span>' : '';

  const row = document.createElement('tr');
  row.className = 'session-row';
  row.id = `row-${s.number}`;
  row.onclick = () => toggleRow(s.number);
  row.innerHTML = `
    <td><span class="expand-ind">\u203A</span></td>
    <td class="mono">${s.number}${currentBadge}</td>
    <td>${s.date}</td>
    <td style="white-space:nowrap">${s.start} – ${s.end}</td>
    <td class="mono">${s.duration}m</td>
    <td><div class="repo-pills">${pills.join('')}</div></td>
    <td class="r">${totalCommits || '–'}</td>
    <td class="r">${totalCommits ? `<span class="c-added">+${fmt(totalAdded)}</span> <span class="c-removed">-${fmt(totalRemoved)}</span>` : '–'}</td>
  `;
  tbody.appendChild(row);

  // Detail row
  const detailRow = document.createElement('tr');
  detailRow.className = 'detail-row';
  detailRow.id = `detail-${s.number}`;

  let detailHtml = '';

  if (s.notes && s.notes.length > 0) {
    detailHtml += `<div class="detail-section">
      <div class="detail-section-label">Notes</div>
      ${s.notes.map(n => `<div class="detail-note">${esc(n)}</div>`).join('')}
    </div>`;
  }

  if (s.ghEvents && s.ghEvents.length > 0) {
    detailHtml += `<div class="detail-section">
      <div class="detail-section-label">GitHub Activity</div>
      ${s.ghEvents.map(e => `<div class="detail-pr">${esc(e.text)}</div>`).join('')}
    </div>`;
  }

  if (s.repos.length > 0) {
    detailHtml += s.repos.map(r => `
      <div class="detail-repo">
        <div class="detail-repo-header">
          <span class="repo-pill" style="background:${COLORS[r.name]||'#666'}18;color:${COLORS[r.name]||'#666'}">${r.name}</span>
          <span class="detail-repo-stats">${r.commits} commits · <span class="c-added">+${fmt(r.added)}</span> <span class="c-removed">-${fmt(r.removed)}</span></span>
        </div>
        ${r.messages.map(m => `<div class="detail-msg">${esc(m)}</div>`).join('')}
      </div>
    `).join('');
  }

  detailRow.innerHTML = `<td colspan="8">${detailHtml}</td>`;
  tbody.appendChild(detailRow);
});

function toggleRow(n) {
  document.getElementById(`detail-${n}`)?.classList.toggle('open');
  document.getElementById(`row-${n}`)?.classList.toggle('expanded');
}
</script>
